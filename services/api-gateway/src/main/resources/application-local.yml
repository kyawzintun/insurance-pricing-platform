# Default host-running local learning configuration.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${API_GATEWAY_PORT:8080}

auth:
  jwt:
    # Same PUBLIC DEVELOPMENT-ONLY KEY as Auth. Never reuse outside local learning.
    public-key: ${AUTH_JWT_PUBLIC_KEY:classpath:keys/dev-jwt-public.pem}
