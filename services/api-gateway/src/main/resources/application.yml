spring:
  profiles:
    default: local
  application:
    name: api-gateway
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: customer-admin
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/customers,/api/v1/admin/customers/**
            - id: pricing-admin
              uri: ${PRICING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/admin/pricing/**
            - id: audit-admin
              uri: ${AUDIT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/admin/audit,/api/v1/admin/audit/**
            - id: quote-service
              uri: ${QUOTE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/quotes,/api/v1/quotes/**,/api/v1/vehicles/brands,/api/v1/vehicles/brands/*/models
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
auth:
  jwt:
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}
gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
