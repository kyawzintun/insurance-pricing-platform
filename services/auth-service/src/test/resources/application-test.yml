# HTTP/auth behavior tests use a mocked UserRepository. PostgreSQL is validated separately.
# No database substitute, local credentials, Docker, or Kafka broker needed for tests.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Deterministic, public development fixtures; never deployment keys.
auth:
  jwt:
    public-key: classpath:keys/dev-jwt-public.pem
    private-key: classpath:keys/dev-jwt-private.pem
