# Default local learning configuration for host-running Auth Service.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${AUTH_SERVICE_PORT:8081}
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/auth_db
    username: ${POSTGRES_USER:insurance_dev}
    password: ${POSTGRES_PASSWORD:local_dev_only}

auth:
  jwt:
    # PUBLICLY KNOWN DEVELOPMENT-ONLY KEY PAIR. Never reuse outside this learning project.
    private-key: ${AUTH_JWT_PRIVATE_KEY:classpath:keys/dev-jwt-private.pem}
    public-key: ${AUTH_JWT_PUBLIC_KEY:classpath:keys/dev-jwt-public.pem}

outbox:
  publisher:
    enabled: ${AUTH_OUTBOX_PUBLISHER_ENABLED:true}

# Plain HTTP localhost only.
auth.refresh.secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
