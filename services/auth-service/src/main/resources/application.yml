spring:
  profiles:
    default: local
  application:
    name: auth-service
  autoconfigure:
    # Custom database-backed authentication; never create a generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "max.block.ms": 1000
        "delivery.timeout.ms": 5000
        "request.timeout.ms": 1000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:15m}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}

user:
  events:
    topic: ${USER_EVENTS_TOPIC:insurance.user.events}
outbox:
  publisher:
    enabled: ${AUTH_OUTBOX_PUBLISHER_ENABLED:false}
    poll-interval: ${AUTH_OUTBOX_POLL_INTERVAL:2000}
    batch-size: ${AUTH_OUTBOX_BATCH_SIZE:50}
