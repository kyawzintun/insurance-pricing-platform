spring:
  profiles:
    default: local
  application:
    name: auth-service
  autoconfigure:
    # Custom database-backed authentication; never create a generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:15m}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}
