spring:
  profiles:
    default: local
  application:
    name: auth-service
  autoconfigure:
    # Custom database-backed authentication; never create a generated default user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "max.block.ms": 1000
        "delivery.timeout.ms": 5000
        "request.timeout.ms": 1000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
auth:
  refresh:
    ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
    cookie-name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  jwt:
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:15m}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}

user:
  events:
    topic: ${USER_EVENTS_TOPIC:insurance.user.events}
outbox:
  publisher:
    enabled: ${AUTH_OUTBOX_PUBLISHER_ENABLED:false}
    poll-interval: ${AUTH_OUTBOX_POLL_INTERVAL:2000}
    batch-size: ${AUTH_OUTBOX_BATCH_SIZE:50}

auth.service-client.id: ${QUOTE_SERVICE_CLIENT_ID:quote-service}
auth.service-client.secret: ${QUOTE_SERVICE_CLIENT_SECRET:}
auth.service-client.token-ttl: ${SERVICE_TOKEN_TTL:5m}

logging:
  pattern:
    level: "service=${spring.application.name} correlationId=%X{correlationId:-none} %5p"
