spring:
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  application:
    name: quote-service
  autoconfigure:
    # JWT authentication; no generated user or password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      data-source-properties:
        # PostgreSQL error details can otherwise print an entire rejected outbox payload.
        logServerErrorDetail: false
  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Bound Kafka waits on the background publisher, never the quote HTTP request.
        "max.block.ms": 1000
        "delivery.timeout.ms": 5000
        "request.timeout.ms": 1000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

auth:
  jwt:
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}
pricing:
  service:
    url: ${PRICING_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${PRICING_CONNECT_TIMEOUT:2s}
    read-timeout: ${PRICING_READ_TIMEOUT:5s}

quote:
  expiration:
    enabled: ${QUOTE_EXPIRATION_ENABLED:true}
    poll-interval: ${QUOTE_EXPIRATION_POLL_INTERVAL:60000}
    batch-size: ${QUOTE_EXPIRATION_BATCH_SIZE:50}
  events:
    topic: ${QUOTE_EVENTS_TOPIC:insurance.quote.events}

# Explicit opt-in outside local development. Unit/HTTP tests do not start the scheduler.
outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    poll-interval: ${OUTBOX_POLL_INTERVAL:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}

service-auth.client-id: ${QUOTE_SERVICE_CLIENT_ID:quote-service}
service-auth.client-secret: ${QUOTE_SERVICE_CLIENT_SECRET:}
service-auth.token-url: ${SERVICE_TOKEN_URL:http://localhost:8081/api/v1/auth/service-token}
service-auth.expiry-margin: ${SERVICE_TOKEN_EXPIRY_MARGIN:30s}

logging:
  pattern:
    level: "service=${spring.application.name} correlationId=%X{correlationId:-none} %5p"

service-auth.connect-timeout: ${AUTH_TOKEN_CONNECT_TIMEOUT:2s}
service-auth.read-timeout: ${AUTH_TOKEN_READ_TIMEOUT:5s}
pricing.circuit-breaker.failure-rate: ${PRICING_CB_FAILURE_RATE_THRESHOLD:50}
pricing.circuit-breaker.minimum-calls: ${PRICING_CB_MIN_CALLS:5}
pricing.circuit-breaker.window: ${PRICING_CB_SLIDING_WINDOW_SIZE:10}
pricing.circuit-breaker.open-wait: ${PRICING_CB_OPEN_WAIT:10s}
