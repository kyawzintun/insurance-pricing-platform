spring:
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  application:
    name: quote-service
  autoconfigure:
    # JWT authentication; no generated user or password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "spring.json.add.type.headers": false
        # Bound synchronous metadata/buffer waiting; broker acknowledgements stay asynchronous.
        "max.block.ms": 1000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}
pricing:
  service:
    url: ${PRICING_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${PRICING_CONNECT_TIMEOUT:2s}
    read-timeout: ${PRICING_READ_TIMEOUT:5s}

quote:
  events:
    topic: ${QUOTE_EVENTS_TOPIC:insurance.quote.events}
