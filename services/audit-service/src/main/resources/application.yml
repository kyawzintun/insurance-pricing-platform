spring:
  profiles:
    default: local
  application:
    name: audit-service
  autoconfigure:
    # Resource-server authentication; no generated user or password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  kafka:
    consumer:
      group-id: ${AUDIT_CONSUMER_GROUP:audit-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        "allow.auto.create.topics": false
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        "max.block.ms": 1000
        "delivery.timeout.ms": 5000
        "request.timeout.ms": 1000
    listener:
      ack-mode: record
      concurrency: 1
      log-container-config: false
  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

kafka:
  consumer:
    max-attempts: ${KAFKA_CONSUMER_MAX_ATTEMPTS:3}
    backoff-ms: ${KAFKA_CONSUMER_BACKOFF_MS:1000}

audit:
  events:
    topic: ${QUOTE_EVENTS_TOPIC:insurance.quote.events}

user:
  events:
    topic: ${USER_EVENTS_TOPIC:insurance.user.events}
    dlq-topic: ${USER_EVENTS_DLQ_TOPIC:insurance.user.events.dlq}

pricing:
  events:
    topic: ${PRICING_EVENTS_TOPIC:insurance.pricing.events}
    dlq-topic: ${PRICING_EVENTS_DLQ_TOPIC:insurance.pricing.events.dlq}

auth:
  jwt:
    public-key: ${AUTH_JWT_PUBLIC_KEY:}
    issuer: ${AUTH_JWT_ISSUER:insurance-auth-service}
