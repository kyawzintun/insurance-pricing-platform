# Default host-running learning configuration.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${AUDIT_SERVICE_PORT:8085}
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/audit_db
    username: ${POSTGRES_USER:insurance_dev}
    password: ${POSTGRES_PASSWORD:local_dev_only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_EXTERNAL_PORT:29092}}

auth:
  jwt:
    # Same PUBLIC DEVELOPMENT-ONLY KEY as Auth/Gateway. Never reuse outside local learning.
    secret: ${AUTH_JWT_SECRET:VnczjVEg+Q2DUmsGnX7ZtEAeji5U42s55cOsNvTc3aY=}
