# Default host-running learning configuration.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${NOTIFICATION_SERVICE_PORT:8084}
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/notification_db
    username: ${POSTGRES_USER:insurance_dev}
    password: ${POSTGRES_PASSWORD:local_dev_only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_EXTERNAL_PORT:29092}}
